# Firebase App Hosting — https://firebase.google.com/docs/app-hosting/configure
# Safe to commit. Secrets live in Cloud Secret Manager (referenced below).

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  # Keep one instance warm: at 0, the first visitor after an idle period
  # waits several seconds for a container to boot. Billed while idle (low
  # idle rate) — set back to 0 to trade that cost for cold starts.
  minInstances: 1
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: kesertors
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: kesertors.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: kesertors.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # Set real values in Firebase console (Backend → Settings → Environment)
  # or: npx firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://mainprod--kesertors.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: kesertors
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@kesertors.iam.gserviceaccount.com
    availability:
      - BUILD
      - RUNTIME

  # Create once: npx firebase apphosting:secrets:set FIREBASE_ADMIN_PRIVATE_KEY
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Create once: npx firebase apphosting:secrets:set STRIPE_SECRET_KEY
  # Use a TEST MODE key (sk_test_...) until ready to go live.
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  # Create once: npx firebase apphosting:secrets:set NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
  # Use a TEST MODE key (pk_test_...) until ready to go live.
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Create once: npx firebase apphosting:secrets:set STRIPE_WEBHOOK_SECRET
  # From a TEST MODE webhook endpoint (Stripe dashboard, in test mode) until ready to go live.
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Email (lib/email). Create once: npx firebase apphosting:secrets:set RESEND_API_KEY
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  # Free-tier sender until a domain is verified in Resend — then only the
  # Resend account owner can receive, so ADMIN_NOTIFY_EMAIL must be that address.
  - variable: EMAIL_FROM
    value: "Keshertours <onboarding@resend.dev>"
    availability:
      - RUNTIME

  # New-booking / new-lead alerts, comma-separated.
  - variable: ADMIN_NOTIFY_EMAIL
    value: zsondhelm@gmail.com
    availability:
      - RUNTIME

  # Admin two-factor enforcement (lib/auth/mfa.ts). When "true", admins without
  # an authenticator app get a sign-in code by email — so keep "false" until
  # EMAIL_FROM is on a domain verified in Resend (the onboarding@resend.dev
  # test sender only reaches the Resend account owner, locking others out).
  - variable: ADMIN_REQUIRE_2FA
    value: "false"
    availability:
      - RUNTIME
