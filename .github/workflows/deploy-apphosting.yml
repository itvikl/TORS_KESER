# Manual deploy of Next.js to Firebase App Hosting.
# Actions → "Deploy App Hosting" → "Use workflow from" (pick branch) → Run workflow.
#
# Prerequisites:
# 1. App Hosting backend "mainprod" (Blaze, us-east4).
# 2. GitHub secret FIREBASE_SERVICE_ACCOUNT — already set.
# 3. Secret Manager secrets in apphosting.yaml.
# 4. Disable App Hosting automatic rollouts from GitHub (avoid surprise/double deploys).

name: Deploy App Hosting

on:
  workflow_dispatch:

concurrency:
  group: apphosting-mainprod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Firebase App Hosting
        run: npx firebase-tools@latest deploy --only apphosting --project kesertors --non-interactive
